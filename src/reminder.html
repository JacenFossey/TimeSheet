<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Timesheet Reminder</title>
<style>
  :root { color-scheme: light; --bg:#fff; --surface:#f3f6f2; --border:#dce5df; --text:#20322a; --muted:#718078; --brand:#2f6f5e; --danger:#b94b56; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; font: 13px/1.4 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; user-select: none; display: flex; flex-direction: column; }
  .countdown { height: 3px; background: var(--border); }
  .countdown-fill { height: 100%; background: var(--brand); transition: width 1s linear; }
  .body { flex: 1; padding: 17px 18px 12px; text-align: center; }
  .time { color: var(--brand); font-size: 11px; font-weight: 750; margin-bottom: 6px; }
  h1 { margin: 0 0 12px; font-size: 17px; letter-spacing: -.02em; }
  .planned { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--muted); }
  .planned strong { display: block; color: var(--text); font-size: 13px; margin-bottom: 1px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 18px 18px; }
  button { height: 48px; border-radius: 11px; border: 1px solid var(--border); background: white; cursor: pointer; font: 800 23px/1 "Segoe UI", sans-serif; transition: .15s ease; }
  .yes { color: var(--brand); } .yes:hover { color: white; background: var(--brand); border-color: var(--brand); }
  .no { color: var(--danger); } .no:hover { background: #f8e9eb; border-color: #e8bfc4; }
  button:disabled { opacity: .45; cursor: default; }
  .hint { display: block; font-size: 9px; font-weight: 650; margin-top: 4px; }
</style>
</head>
<body>
  <div class="countdown"><div class="countdown-fill" id="countdown" style="width:100%"></div></div>
  <div class="body">
    <div class="time" id="slotTimeLabel"></div>
    <h1>Did this go as planned?</h1>
    <div class="planned"><strong id="plannedCategory">Nothing planned</strong><span id="plannedText">Use × to enter what you did.</span></div>
  </div>
  <div class="actions">
    <button class="yes" id="yesBtn" aria-label="Worked as planned">✓<span class="hint">As planned</span></button>
    <button class="no" id="noBtn" aria-label="Enter different work">×<span class="hint">Something else</span></button>
  </div>

<script src="ts.js"></script>
<script>
(() => {
  'use strict';
  let slotKey = null;
  let planned = null;
  let countdown = 120;
  let countdownTimer = null;
  const appWindow = window.__TAURI__.window.getCurrentWindow();
  const { LogicalSize, LogicalPosition } = window.__TAURI__.dpi;
  const $ = id => document.getElementById(id);

  function minutesToKey(minutes) {
    return `${String(Math.floor(minutes / 60)).padStart(2, '0')}:${String(minutes % 60).padStart(2, '0')}`;
  }

  function timeLabel(minutes) {
    const hour = Math.floor(minutes / 60);
    const minute = minutes % 60;
    const hour12 = hour === 0 ? 12 : hour > 12 ? hour - 12 : hour;
    return `${hour12}:${String(minute).padStart(2, '0')} ${hour < 12 ? 'AM' : 'PM'}`;
  }

  function todayString() {
    const date = new Date();
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
  }

  async function placeAndShow() {
    await new Promise(resolve => requestAnimationFrame(resolve));
    const width = 320;
    const height = Math.ceil(document.body.scrollHeight);
    await appWindow.setSize(new LogicalSize(width, height));
    await appWindow.setPosition(new LogicalPosition(screen.availWidth - width - 16, screen.availHeight - height - 16));
    await appWindow.show();
  }

  function startCountdown() {
    countdownTimer = window.setInterval(() => {
      countdown -= 1;
      $('countdown').style.width = `${countdown / 120 * 100}%`;
      if (countdown <= 0) window.ts.dismissReminder();
    }, 1000);
  }

  async function init() {
    const now = new Date();
    const currentMinutes = Math.floor((now.getHours() * 60 + now.getMinutes()) / 15) * 15;
    const start = currentMinutes - 15;
    if (start < 0) { await window.ts.dismissReminder(); return; }
    slotKey = minutesToKey(start);
    $('slotTimeLabel').textContent = `${timeLabel(start)} – ${timeLabel(currentMinutes)}`;

    const [day, categories] = await Promise.all([
      window.ts.loadDay(todayString()),
      window.ts.loadCategories(),
    ]);
    planned = day[slotKey]?.planned || null;
    const categoryMap = Object.fromEntries(categories.map(category => [category.id, category]));
    if (planned && (planned.cat !== 'none' || planned.text)) {
      $('plannedCategory').textContent = categoryMap[planned.cat]?.label || planned.cat || 'Planned work';
      $('plannedText').textContent = planned.text || 'Planned work';
    } else {
      $('yesBtn').disabled = true;
    }
    startCountdown();
    await placeAndShow();
  }

  $('yesBtn').addEventListener('click', async () => {
    window.clearInterval(countdownTimer);
    $('yesBtn').disabled = true;
    $('noBtn').disabled = true;
    try {
      await window.ts.submitReminder(slotKey, planned.cat || 'none', planned.text || '');
    } catch (error) {
      $('yesBtn').disabled = false;
      $('noBtn').disabled = false;
      $('plannedText').textContent = String(error);
      startCountdown();
    }
  });

  $('noBtn').addEventListener('click', async () => {
    window.clearInterval(countdownTimer);
    $('yesBtn').disabled = true;
    $('noBtn').disabled = true;
    try {
      await window.ts.openReminderCorrection(slotKey);
    } catch (error) {
      $('yesBtn').disabled = false;
      $('noBtn').disabled = false;
      $('plannedText').textContent = String(error);
      startCountdown();
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') window.ts.dismissReminder();
  });

  init().catch(error => { $('plannedText').textContent = String(error); placeAndShow(); });
})();
</script>
</body>
</html>
