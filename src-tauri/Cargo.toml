[package]
name = "timesheet"
version = "2.0.1"
description = "Daily Timesheet"
authors = ["Jacen Fossey"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
chrono = "0.4"
# ponytail: rustls-tls (not native-tls) so the SMTP build has no OpenSSL/system dep on CI.
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "rustls-tls"] }
# windows-native: store the SendGrid key in Windows Credential Manager, not plaintext.
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
