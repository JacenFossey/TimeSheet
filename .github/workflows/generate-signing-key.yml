name: Generate updater signing key

# One-off: generates the tauri updater keypair. Public key is printed in the
# log; private key is uploaded as a 1-day artifact — paste its contents into
# the TAURI_SIGNING_PRIVATE_KEY repo secret. Key password is empty (the key
# only ever lives in the secret), so no password secret is needed.
# Delete this workflow file after use.
# ponytail: push trigger (path-filtered to this file) because
# workflow_dispatch only resolves on the default branch.
on:
  push:
    branches: [tauri-port]
    paths: ['.github/workflows/generate-signing-key.yml']

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache tauri-cli
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2

      - name: Install tauri-cli
        shell: pwsh
        run: |
          if (Test-Path "$HOME/.cargo/bin/cargo-tauri.exe") { Write-Host "tauri-cli restored from cache" }
          else { cargo install tauri-cli --version "^2" --locked }

      - name: Generate keypair
        shell: pwsh
        run: |
          cargo tauri signer generate -w key.key --password "" --ci
          Write-Host "PUBLIC KEY (goes in tauri.conf.json plugins.updater.pubkey):"
          Get-Content key.key.pub

      - name: Upload private key
        uses: actions/upload-artifact@v4
        with:
          name: updater-private-key
          path: key.key
          retention-days: 1
